<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бухгалтерия Выборг — УПД и сверка</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #ecfdf5;
      --success-border: #10b981;
      --warn-bg: #fffbeb;
      --warn-border: #f59e0b;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --border: #e5e7eb;
      --row-alt: #fafbfc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      padding: 28px 28px 32px;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
      font-weight: 600;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 20px 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab-button {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .tab-button:hover {
      color: var(--text);
      background: transparent;
    }

    .tab-button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    select,
    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }

    select:focus,
    input[type="file"]:focus,
    input[type="text"]:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
      border-color: var(--primary);
    }

    .field {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .banner {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      border-left: 4px solid;
      font-size: 14px;
      line-height: 1.5;
    }

    .banner.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #065f46;
    }

    .banner.warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: #92400e;
    }

    .banner.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #991b1b;
    }

    .banner h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }

    .banner ul {
      margin: 8px 0 0 0;
      padding-left: 20px;
    }

    .banner a {
      color: inherit;
      font-weight: 600;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* --- Reconciliation summary view --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-card .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .stat-card .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }

    .stat-card.warn .stat-value { color: #b45309; }
    .stat-card.error .stat-value { color: #b91c1c; }
    .stat-card.success .stat-value { color: #047857; }

    .section-list {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .section-list-header {
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-list-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .section-list-header .count-badge {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .copy-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      flex-shrink: 0;
    }

    .copy-btn.copied {
      background: var(--success-border);
    }

    table.diff-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.diff-table th,
    table.diff-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    table.diff-table th {
      background: #fafbfc;
      font-weight: 500;
      color: var(--muted);
    }

    table.diff-table tr:nth-child(even) td {
      background: var(--row-alt);
    }

    table.diff-table tr:last-child td {
      border-bottom: 0;
    }

    table.diff-table .num {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .empty-list {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* --- Upload batch view --- */
    .visually-hidden-file,
    input[type="file"].visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      border: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .file-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin: 0;
      padding: 11px 16px;
      border: 1px dashed var(--primary);
      border-radius: 8px;
      background: #fff;
      color: var(--primary);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .file-add-btn:hover { background: #f0f6ff; }
    .file-add-btn:active { background: #e6efff; }

    .file-hint {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
    }

    .file-preview {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .file-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .file-preview .file-clear-btn {
      width: auto;
      padding: 2px 6px;
      border: 0;
      background: transparent;
      color: var(--error-border);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .file-preview .file-clear-btn:hover {
      background: transparent;
      text-decoration: underline;
    }

    .file-preview ul {
      margin: 0;
      padding-left: 0;
      list-style: none;
    }

    .file-preview li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }

    .file-preview .file-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .file-preview .file-size {
      flex: 0 0 auto;
      color: var(--muted);
    }

    .file-preview .file-remove {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }

    .file-preview .file-remove:hover {
      background: var(--error-bg);
      color: var(--error-border);
    }

    .batch-summary {
      margin-top: 20px;
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .batch-summary strong {
      color: var(--text);
      font-weight: 600;
    }

    .item-banner {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 4px solid;
      font-size: 13px;
      line-height: 1.5;
    }

    .item-banner.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #065f46;
    }

    .item-banner.warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: #92400e;
    }

    .item-banner.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #991b1b;
    }

    .item-banner h4 {
      margin: 0 0 6px 0;
      font-size: 14px;
      font-weight: 600;
      word-break: break-all;
    }

    .item-banner ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }

    .item-banner a {
      color: inherit;
      font-weight: 600;
    }

    @media (max-width: 540px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      table.diff-table th,
      table.diff-table td { padding: 6px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Бухгалтерия Выборг</h1>
    <p class="subtitle">Загрузка УПД и сверка с реестром 1С.</p>

    <div class="tabs" role="tablist">
      <button class="tab-button active" data-tab="upload" type="button" role="tab">Загрузка УПД</button>
      <button class="tab-button" data-tab="reconciliation" type="button" role="tab">Сводка</button>
    </div>

    <!-- ============================================================== -->
    <!-- TAB: UPLOAD                                                    -->
    <!-- ============================================================== -->
    <section id="tab-upload" role="tabpanel">
      <form id="upload-form">
        <div class="field">
          <label for="foreman">Прораб</label>
          <input type="text" id="foreman" name="foreman"
                 placeholder="Имя прораба"
                 autocomplete="name"
                 maxlength="100" required />
        </div>

        <div class="field">
          <label for="file">Файлы УПД (PDF или фото, можно несколько)</label>
          <input type="file" id="file" name="files" accept="application/pdf,image/*"
                 multiple class="visually-hidden-file" />
          <label for="file" class="file-add-btn">＋ Добавить файлы</label>
          <p class="file-hint">
            На некоторых телефонах (например, POCO/Xiaomi) галерея позволяет выбрать
            только один файл за раз. В этом случае нажимайте «Добавить файлы»
            несколько раз — выбранные файлы накапливаются в списке ниже.
          </p>
          <div id="file-preview" class="file-preview hidden"></div>
        </div>

        <button type="submit" id="submit-btn">Отправить</button>
      </form>

      <div id="result" class="hidden"></div>
    </section>

    <!-- ============================================================== -->
    <!-- TAB: RECONCILIATION                                            -->
    <!-- ============================================================== -->
    <section id="tab-reconciliation" class="hidden" role="tabpanel">
      <div id="reconciliation-pending" class="banner warn hidden" style="margin-top:0;"></div>
      <form id="reconciliation-form">
        <div class="field">
          <label for="reconciliation-file">Реестр 1С (.xls / .xlsx / .csv)</label>
          <input type="file" id="reconciliation-file" name="file"
                 accept=".xls,.xlsx,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"
                 required />
        </div>
        <button type="submit" id="reconciliation-btn">Сравнить</button>
      </form>

      <div id="reconciliation-result" class="hidden"></div>
    </section>
  </main>

  <script>
    (function () {
      // ----- shared helpers -----
      const ERROR_MESSAGES = {
        unsupported_file_type: "Формат файла не поддерживается. Загрузите PDF или изображение.",
        vision_extraction_error: "Не удалось обработать документ через ИИ. Попробуйте ещё раз через минуту.",
        rate_limit_error: "Сервис анализа сейчас перегружен. Попробуйте через 1–2 минуты.",
        sheets_append_error: "Документ распознан, но запись в таблицу не удалась. Сообщите администратору.",
        onec_parse_error: "Не удалось разобрать выгрузку 1С. Проверьте формат файла (.xls / .xlsx / .csv) и колонки «Номер вх.», «Дата (вх.)», «Сумма».",
        sheets_read_error: "Не удалось прочитать таблицу прорабов. Сообщите администратору.",
        sheets_write_error: "Не удалось записать сводку в Google Sheet. Сообщите администратору.",
        reconciliation_disabled: "Сверка временно отключена. Сейчас форма работает только на загрузку УПД.",
        app_error: "Внутренняя ошибка приложения.",
        unexpected_error: "Произошла непредвиденная ошибка."
      };

      const FIELD_LABELS = {
        organization: "Организация",
        counterparty: "Контрагент",
        date: "Дата",
        amount: "Сумма",
        upd_number: "Номер УПД"
      };

      // Non-fatal notes shown alongside a success banner (the row was written).
      const WARNING_MESSAGES = {
        drive_upload_failed: "Скан не удалось сохранить в архив Drive — строка в таблице записана, скан можно приложить позже."
      };

      function escape(value) {
        const str = String(value ?? "");
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // ----- reconciliation paused (этап 1) -----
      // Сверка временно отключена — форма только грузит УПД, реестр копится и
      // ничего не затирается. Чтобы вернуть вкладку «Сводка»: поставь здесь
      // RECON_ENABLED = true И reconciliation_enabled=true в окружении бэкенда.
      const RECON_ENABLED = false;

      // ----- tabs -----
      const tabButtons = document.querySelectorAll(".tab-button");
      const panels = {
        upload: document.getElementById("tab-upload"),
        reconciliation: document.getElementById("tab-reconciliation")
      };
      tabButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          tabButtons.forEach(b => b.classList.toggle("active", b === btn));
          Object.entries(panels).forEach(([name, el]) => {
            el.classList.toggle("hidden", name !== tab);
          });
        });
      });

      if (!RECON_ENABLED) {
        // Hide the «Сводка» tab + its panel; with a single tab the bar is
        // pointless, so collapse it and simplify the subtitle. Markup stays in
        // the DOM (just hidden) so re-enabling is a one-line flip.
        const reconBtn = document.querySelector('.tab-button[data-tab="reconciliation"]');
        if (reconBtn) reconBtn.classList.add("hidden");
        if (panels.reconciliation) panels.reconciliation.classList.add("hidden");
        const tabsBar = document.querySelector(".tabs");
        if (tabsBar) tabsBar.classList.add("hidden");
        const subtitle = document.querySelector(".subtitle");
        if (subtitle) subtitle.textContent = "Загрузка УПД.";
      }

      // ============================================================
      // UPLOAD form (multi-file batch)
      // ============================================================
      (function initUpload() {
        const form = document.getElementById("upload-form");
        const fileInput = document.getElementById("file");
        const previewEl = document.getElementById("file-preview");
        const btn = document.getElementById("submit-btn");
        const resultEl = document.getElementById("result");

        // Map filename → blob URL for inline previews of just-uploaded files.
        // Revoked on each new submission to avoid memory leaks.
        let lastBlobUrls = new Map();

        // Accumulated selection. The native picker on some Android ROMs
        // (notably Xiaomi/POCO galleries) ignores `multiple` and returns one
        // file per tap, so we never read fileInput.files directly on submit —
        // instead every `change` APPENDS to this array and the input is reset,
        // letting the bookkeeper build up a batch one tap at a time.
        let selectedFiles = [];

        function fileKey(f) {
          return [f.name, f.size, f.lastModified || 0].join("␀");
        }

        // Per-error-code copy that explains the validation failure to the user.
        // The pipeline error codes are also handled via the shared ERROR_MESSAGES.
        const FILE_ERROR_MESSAGES = Object.assign({}, ERROR_MESSAGES, {
          file_too_large: "Файл слишком большой.",
          empty_file: "Файл пустой.",
          network_error: "Не удалось отправить эту пачку — проверьте интернет и повторите."
        });

        function formatBytes(n) {
          if (n < 1024) return n + " Б";
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " КБ";
          return (n / 1024 / 1024).toFixed(1) + " МБ";
        }

        function renderPreview() {
          if (selectedFiles.length === 0) {
            previewEl.classList.add("hidden");
            previewEl.innerHTML = "";
            return;
          }
          const items = selectedFiles
            .map((f, i) =>
              `<li>` +
              `<span class="file-name">${escape(f.name)}</span>` +
              `<span class="file-size">${formatBytes(f.size)}</span>` +
              `<button type="button" class="file-remove" data-index="${i}" ` +
              `aria-label="Удалить ${escape(f.name)}">✕</button>` +
              `</li>`)
            .join("");
          previewEl.innerHTML =
            `<div class="file-preview-head">` +
            `<span>Выбрано файлов: <strong>${selectedFiles.length}</strong></span>` +
            `<button type="button" class="file-clear-btn" id="file-clear-all">Очистить всё</button>` +
            `</div>` +
            `<ul>${items}</ul>`;
          previewEl.classList.remove("hidden");
        }

        // Append the just-picked files (dedup by name+size+mtime), then clear the
        // input so the same file can be re-picked and the native control stays
        // "empty" — the list below is the single source of truth.
        function onFilesPicked() {
          const picked = fileInput.files ? Array.from(fileInput.files) : [];
          for (const f of picked) {
            const key = fileKey(f);
            if (!selectedFiles.some(s => fileKey(s) === key)) {
              selectedFiles.push(f);
            }
          }
          fileInput.value = "";
          renderPreview();
        }

        fileInput.addEventListener("change", onFilesPicked);

        // Remove one file or clear the whole list (event delegation: the list
        // is re-rendered on every change so per-button listeners would go stale).
        previewEl.addEventListener("click", function (e) {
          const removeBtn = e.target.closest(".file-remove");
          if (removeBtn) {
            const idx = Number(removeBtn.getAttribute("data-index"));
            if (!Number.isNaN(idx)) {
              selectedFiles.splice(idx, 1);
              renderPreview();
            }
            return;
          }
          if (e.target.closest("#file-clear-all")) {
            selectedFiles = [];
            renderPreview();
          }
        });

        function revokeBlobUrls() {
          for (const url of lastBlobUrls.values()) URL.revokeObjectURL(url);
          lastBlobUrls = new Map();
        }

        function buildBlobUrls(files) {
          revokeBlobUrls();
          for (const f of files) {
            if (!lastBlobUrls.has(f.name)) {
              lastBlobUrls.set(f.name, URL.createObjectURL(f));
            }
          }
        }

        function renderFileLink(filename) {
          const url = filename ? lastBlobUrls.get(filename) : null;
          if (!url) return "";
          return (
            `<p><a href="${escape(url)}" target="_blank" rel="noopener">` +
            `Посмотреть отправленный файл (${escape(filename)}) →</a></p>`
          );
        }

        function renderRecord(record) {
          if (!record) return "";
          const rows = Object.keys(FIELD_LABELS)
            .map(key => {
              const value = record[key];
              const display = value === null || value === undefined || value === ""
                ? "<em>—</em>"
                : escape(value);
              return `<li><strong>${FIELD_LABELS[key]}:</strong> ${display}</li>`;
            })
            .join("");
          return `<ul>${rows}</ul>`;
        }

        function renderMissing(missing) {
          if (!missing || missing.length === 0) return "";
          const labels = missing.map(k => FIELD_LABELS[k] || k).join(", ");
          return `<p>Не удалось распознать: <strong>${escape(labels)}</strong></p>`;
        }

        function classifyItem(item) {
          if (item.ok && !item.needs_review) return "success";
          if (item.ok && item.needs_review) return "warn";
          return "error";
        }

        function renderItem(item, sheetUrlFallback) {
          const kind = classifyItem(item);
          const title = item.filename || "(без имени)";
          const fileLink = renderFileLink(item.filename);

          if (kind === "success") {
            const sheetUrl = item.sheet_url || sheetUrlFallback;
            const sheetLink = sheetUrl
              ? `<p><a href="${escape(sheetUrl)}" target="_blank" rel="noopener">Открыть таблицу →</a></p>`
              : "";
            const warnNote = item.warning
              ? `<p class="meta">⚠️ ${escape(WARNING_MESSAGES[item.warning] || item.warning)}</p>`
              : "";
            return (
              `<div class="item-banner success">` +
              `<h4>✅ ${escape(title)}</h4>` +
              `<p>УПД распознан и добавлен в таблицу.</p>` +
              renderRecord(item.record) +
              warnNote +
              fileLink +
              sheetLink +
              `</div>`
            );
          }

          if (kind === "warn") {
            return (
              `<div class="item-banner warn">` +
              `<h4>⚠️ ${escape(title)}</h4>` +
              `<p>Документ распознан не полностью. Строка в таблицу не добавлена.</p>` +
              renderMissing(item.missing_fields) +
              renderRecord(item.record) +
              fileLink +
              `<p class="meta">correlation_id: ${escape(item.correlation_id || "")}</p>` +
              `</div>`
            );
          }

          const msg = FILE_ERROR_MESSAGES[item.error] || item.error || "Неизвестная ошибка.";
          return (
            `<div class="item-banner error">` +
            `<h4>❌ ${escape(title)}</h4>` +
            `<p>${escape(msg)}</p>` +
            fileLink +
            `<p class="meta">correlation_id: ${escape(item.correlation_id || "")}</p>` +
            `</div>`
          );
        }

        function showResultRaw(html, kind) {
          resultEl.className = "banner " + kind;
          resultEl.innerHTML = html;
          resultEl.classList.remove("hidden");
        }

        // Live progress while a large selection is sent chunk-by-chunk.
        function showProgress(done, total) {
          resultEl.className = "";
          resultEl.innerHTML =
            `<div class="batch-summary">` +
            `<span class="spinner"></span>Обработка… готово ` +
            `<strong>${done}</strong> из <strong>${total}</strong></div>`;
          resultEl.classList.remove("hidden");
        }

        function showBatchResult(data) {
          const items = Array.isArray(data.items) ? data.items : [];
          const total = items.length;
          const success = items.filter(i => i.ok && !i.needs_review).length;
          const warn = items.filter(i => i.ok && i.needs_review).length;
          const error = items.filter(i => !i.ok).length;

          // Pick a fallback sheet URL from any successful item so success
          // banners without a per-item sheet_url still link to the spreadsheet.
          const sheetUrlFallback = (items.find(i => i.sheet_url) || {}).sheet_url || null;

          const summary =
            `<div class="batch-summary">` +
            `Обработано: <strong>${total}</strong> · ` +
            `✅ ${success} · ⚠️ ${warn} · ❌ ${error}` +
            `</div>`;
          const body = items.map(i => renderItem(i, sheetUrlFallback)).join("");

          resultEl.className = "";
          resultEl.innerHTML = summary + body;
          resultEl.classList.remove("hidden");
        }

        async function submit(event) {
          event.preventDefault();
          resultEl.classList.add("hidden");
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>Обработка…';

          const selected = selectedFiles.slice();
          if (selected.length === 0) {
            showResultRaw(`<h3>Не выбран файл</h3><p>Выберите хотя бы один файл УПД.</p>`, "error");
            btn.disabled = false;
            btn.textContent = "Отправить";
            return;
          }

          // Build blob URLs BEFORE we (possibly) reset the form so previews keep working.
          buildBlobUrls(selected);

          const foremanValue = document.getElementById("foreman").value;

          // The backend caps each /api/upload request at `max_batch_files` and
          // processes files sequentially, so one giant request would blow the
          // proxy timeout. Split the selection into chunks and POST them one
          // after another, aggregating per-file results into a single batch view.
          // CHUNK_SIZE must stay <= the backend's max_batch_files (app/config.py).
          const CHUNK_SIZE = 10;
          const chunks = [];
          for (let i = 0; i < selected.length; i += CHUNK_SIZE) {
            chunks.push(selected.slice(i, i + CHUNK_SIZE));
          }

          const allItems = [];
          let processed = 0;

          for (const chunk of chunks) {
            showProgress(processed, selected.length);

            const formData = new FormData();
            formData.append("foreman", foremanValue);
            for (const f of chunk) formData.append("files", f);

            let response;
            try {
              response = await fetch("/api/upload", {
                method: "POST",
                body: formData
              });
            } catch (err) {
              // Network drop: fail just this chunk's files and keep going.
              for (const f of chunk) {
                allItems.push({ ok: false, filename: f.name, error: "network_error" });
              }
              processed += chunk.length;
              continue;
            }

            let data = null;
            try { data = await response.json(); } catch (_) { /* fallthrough */ }

            if (!response.ok || !data || !Array.isArray(data.items)) {
              const detail = data && data.detail ? data.detail : `HTTP ${response.status}`;
              for (const f of chunk) {
                allItems.push({ ok: false, filename: f.name, error: detail });
              }
              processed += chunk.length;
              continue;
            }

            for (const item of data.items) allItems.push(item);
            processed += chunk.length;
          }

          const batchOk = allItems.length > 0 &&
            allItems.every(i => i.ok && !i.needs_review);

          showBatchResult({ ok: batchOk, items: allItems });

          // Drop files that were COMMITTED (written to the sheet: ok && not
          // needs_review) from the accumulated selection, so a partial-success
          // batch never re-uploads them on the next submit — that re-send was
          // the source of duplicate sheet rows. Files that errored or need
          // review stay selected for a retry. Matching is by fileKey
          // (name+size+mtime) against the snapshot we actually sent, so picks
          // the user made during the POST are unaffected and same-named files
          // aren't confused.
          const committedKeys = new Set();
          for (let i = 0; i < selected.length && i < allItems.length; i++) {
            const it = allItems[i];
            if (it && it.ok && !it.needs_review) {
              committedKeys.add(fileKey(selected[i]));
            }
          }
          if (committedKeys.size > 0) {
            selectedFiles = selectedFiles.filter(f => !committedKeys.has(fileKey(f)));
          }
          fileInput.value = "";
          renderPreview();

          // Clear the foreman field only once the whole selection is done
          // (i.e. everything committed) — otherwise keep it for the retry.
          if (selectedFiles.length === 0) {
            const foremanEl = document.getElementById("foreman");
            if (foremanEl) foremanEl.value = "";
          }

          btn.disabled = false;
          btn.textContent = "Отправить";
        }

        form.addEventListener("submit", submit);
      })();

      // ============================================================
      // RECONCILIATION form
      // ============================================================
      (function initReconciliation() {
        if (!RECON_ENABLED) return;  // сверка на паузе — форму не активируем
        const form = document.getElementById("reconciliation-form");
        const btn = document.getElementById("reconciliation-btn");
        const resultEl = document.getElementById("reconciliation-result");
        const pendingEl = document.getElementById("reconciliation-pending");

        function showBanner(html, kind) {
          resultEl.className = "banner " + kind;
          resultEl.innerHTML = html;
          resultEl.classList.remove("hidden");
        }

        function showSummary(html) {
          resultEl.className = "";
          resultEl.innerHTML = html;
          resultEl.classList.remove("hidden");
        }

        function statCard(label, value, kind) {
          return `<div class="stat-card${kind ? " " + kind : ""}"><div class="stat-label">${escape(label)}</div><div class="stat-value">${escape(value)}</div></div>`;
        }

        async function submit(event) {
          event.preventDefault();
          resultEl.classList.add("hidden");
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>Сравниваем…';

          const formData = new FormData(form);

          let response;
          try {
            response = await fetch("/api/reconciliation", {
              method: "POST",
              body: formData
            });
          } catch (err) {
            showBanner(
              `<h3>Не удалось отправить</h3><p>Проверьте подключение к интернету и попробуйте ещё раз.</p>`,
              "error"
            );
            btn.disabled = false;
            btn.textContent = "Сравнить";
            return;
          }

          let data = null;
          try {
            data = await response.json();
          } catch (_) { /* fallthrough */ }

          if (!response.ok) {
            const detail = data && data.detail ? data.detail : `HTTP ${response.status}`;
            showBanner(
              `<h3>Ошибка ${response.status}</h3><p>${escape(detail)}</p>`,
              "error"
            );
            btn.disabled = false;
            btn.textContent = "Сравнить";
            return;
          }

          if (!data.ok) {
            const msg = ERROR_MESSAGES[data.error] || data.error || "Неизвестная ошибка.";
            showBanner(
              `<h3>Не удалось выполнить сверку</h3><p>${escape(msg)}</p>` +
              `<p class="meta">correlation_id: ${escape(data.correlation_id || "")}</p>`,
              "error"
            );
            btn.disabled = false;
            btn.textContent = "Сравнить";
            return;
          }

          const stats = data.stats || { matched: 0, missing: 0, extras: 0, amount_mismatch: 0 };
          const mismatch = stats.amount_mismatch || 0;
          const hasIssue = stats.missing > 0 || stats.extras > 0 || mismatch > 0;
          const bannerKind = hasIssue ? "warn" : "success";
          const bannerTitle = hasIssue
            ? "Сводка готова — есть расхождения"
            : "Сводка готова — расхождений нет";
          const matchedKind = stats.matched > 0 ? "success" : "";
          const missingKind = stats.missing > 0 ? "warn" : "";
          const extrasKind = stats.extras > 0 ? "warn" : "";
          const mismatchKind = mismatch > 0 ? "warn" : "";

          const html =
            `<div class="banner ${bannerKind}" style="margin-top:0;">` +
            `<h3>${bannerTitle}</h3>` +
            `<p>Полная таблица обновлена в Google Sheet.</p>` +
            `</div>` +
            `<div class="stats-grid">` +
            statCard("Совпало", stats.matched, matchedKind) +
            statCard("Не хватает", stats.missing, missingKind) +
            statCard("Лишние", stats.extras, extrasKind) +
            statCard("Сумма ≠", mismatch, mismatchKind) +
            `</div>` +
            `<p class="meta">correlation_id: ${escape(data.correlation_id || "")}</p>`;

          showSummary(html);
          // The sheet was just rebuilt: every upload now carries a status, so
          // the "несведённые загрузки" hint no longer applies.
          pendingEl.classList.add("hidden");
          btn.disabled = false;
          btn.textContent = "Сравнить";
        }

        // --- несведённые загрузки --------------------------------------------
        // Foreman uploads land as green-only rows below the last reconciliation
        // output (gspread appends after the last filled row). They stay there,
        // unpaired, until the next «Сравнить». This hint tells the bookkeeper
        // there is un-reconciled work waiting.
        function pluralUpd(n) {
          const a = Math.abs(n) % 100, b = a % 10;
          if (a > 10 && a < 20) return "документов";
          if (b === 1) return "документ";
          if (b >= 2 && b <= 4) return "документа";
          return "документов";
        }

        async function refreshPending() {
          let n = 0;
          try {
            const r = await fetch("/api/reconciliation/pending");
            if (!r.ok) { pendingEl.classList.add("hidden"); return; }
            const d = await r.json();
            n = (d && d.pending) || 0;
          } catch (_) {
            pendingEl.classList.add("hidden");
            return;
          }
          if (n > 0) {
            pendingEl.innerHTML =
              `<h3>Есть несведённые загрузки</h3>` +
              `<p>Прорабы загрузили ${n} ${pluralUpd(n)} после последней сводки. ` +
              `Нажмите «Сравнить» с актуальной выгрузкой 1С, чтобы обновить таблицу.</p>`;
            pendingEl.classList.remove("hidden");
          } else {
            pendingEl.classList.add("hidden");
          }
        }

        const reconTabBtn = document.querySelector('.tab-button[data-tab="reconciliation"]');
        if (reconTabBtn) reconTabBtn.addEventListener("click", refreshPending);

        form.addEventListener("submit", submit);
      })();
    })();
  </script>
</body>
</html>
