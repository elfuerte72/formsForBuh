# Railway build/deploy configuration.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# IPv6 is mandatory — Yandex Forms send webhooks only from 2a02:6b8:c00::/40.
startCommand = "uvicorn app.main:app --host :: --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
